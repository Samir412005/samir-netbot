name: Mobile-only APK
on:
  push:
    branches: [mobile-only]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests, mock Bot API, lint and signed debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-evidence
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Prepare APK and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk samir-netbot-0.3.0-preview3.apk
          sha256sum samir-netbot-0.3.0-preview3.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: samir-netbot-preview3
          path: |
            samir-netbot-0.3.0-preview3.apk
            SHA256SUMS.txt
      - name: Publish preview after successful tests and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview-3 >/dev/null 2>&1 || gh release create preview-3 --target "$GITHUB_SHA" --prerelease --title 'Mobile-only 0.3.0-preview3' --notes 'Standalone Android bot. No hosting. Debug-signed APK. Unit tests, mock Telegram transport and Android lint passed. Real SIM/USSD and real Telegram-token verification still require a phone. See mobile-only README.'
          gh release upload preview-3 samir-netbot-0.3.0-preview3.apk SHA256SUMS.txt --clobber
