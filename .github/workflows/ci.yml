name: Test, build and publish companion
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: netbot-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Python tests and migrations
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python -m compileall -q bot api core
          python -m pytest -q --junitxml=pytest.xml | tee pytest-output.txt
          DATABASE_URL=sqlite:///migration-check.db alembic upgrade head
          DATABASE_URL=sqlite:///migration-check.db alembic check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android compile, unit tests and lint
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Real HTTPS API to Kotlin companion client, simulated telephony
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/integration.db"
          export ALLOW_HTTP_LOCAL=false
          export COMMAND_TTL=180
          export INTEGRATION_BASE=https://localhost:8443
          export INTEGRATION_CERT="$RUNNER_TEMP/cert.pem"
          export PAIR_CODE_FILE="$RUNNER_TEMP/pair.txt"
          export COMPANION_READY_FILE="$RUNNER_TEMP/companion-ready"
          export PROOF_FILE="$GITHUB_WORKSPACE/simulation-proof.json"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/key.pem" -out "$INTEGRATION_CERT" -days 1 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost'
          alembic upgrade head
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8443 --ssl-keyfile "$RUNNER_TEMP/key.pem" --ssl-certfile "$INTEGRATION_CERT" --no-access-log > "$RUNNER_TEMP/api.log" 2>&1 &
          API_PID=$!
          python -m scripts.integration_setup > integration-setup.txt 2>&1 &
          SETUP_PID=$!
          trap 'kill $API_PID $SETUP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do test -f "$PAIR_CODE_FILE" && curl --cacert "$INTEGRATION_CERT" -fsS "$INTEGRATION_BASE/health" && break; sleep 1; done
          (cd android && gradle --no-daemon testDebugUnitTest --rerun-tasks --tests 'com.samir.netbot.CompanionIntegrationTest')
          wait "$SETUP_PID"
          test -s simulation-proof.json
          cat simulation-proof.json
      - name: Restore production signing key if configured
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/netbot.jks"
            echo 'production=true' >> "$GITHUB_OUTPUT"
          else
            echo 'production=false' >> "$GITHUB_OUTPUT"
            echo 'Preview only: debug-signed APK; no production signing key configured.'
          fi
      - name: Production APK (stable private key)
        if: steps.signing.outputs.production == 'true'
        working-directory: android
        env:
          SIGNING_STORE: ${{ runner.temp }}/netbot.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Package and verify signature
        env:
          PRODUCTION: ${{ steps.signing.outputs.production }}
        run: |
          if [ "$PRODUCTION" = true ]; then cp android/app/build/outputs/apk/release/app-release.apk samir-netbot.apk; else cp android/app/build/outputs/apk/debug/app-debug.apk samir-netbot.apk; fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs samir-netbot.apk > signature.txt
          sha256sum samir-netbot.apk > SHA256SUMS.txt
          printf 'Production signing: %s\n' "$PRODUCTION" > build-info.txt
          printf 'USSD radio execution: NOT TESTED; Kotlin JVM transport simulation only.\n' >> build-info.txt
      - name: Publish preview release with test evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" samir-netbot.apk SHA256SUMS.txt signature.txt build-info.txt simulation-proof.json pytest-output.txt pytest.xml --target "$GITHUB_SHA" --prerelease --title "Netbot MVP $TAG" --notes 'نسخة اختبار. التفعيل ينفذ USSD على الهاتف بعد موافقة؛ لم تختبر شريحة حقيقية. الإثبات المرفق محاكاة طبقة الشبكة بواسطة عميل Kotlin نفسه عبر HTTPS. توقيع إنتاجي فقط عند تهيئة KEYSTORE_B64 وSIGNING_PASSWORD؛ وإلا APK موقّع بمفتاح debug تجريبي. لا ضمان لتفعيل كل العروض أو القوائم المتعددة.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            pytest*.txt
            pytest.xml
            android/app/build/reports/
            android/app/build/test-results/
            simulation-proof.json
            integration-setup.txt
            signature.txt
            build-info.txt
      - name: Cleanup temporary keys
        if: always()
        run: rm -f "$RUNNER_TEMP/netbot.jks" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/pair.txt"
