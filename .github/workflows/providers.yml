name: Provider adapters
on:
  push:
    branches: [providers]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q providers bot/provider_main.py
      - run: python -m unittest discover -s tests -p 'test_provider*.py' -v 2>&1 | tee provider-tests.txt
      - run: python -m unittest discover -s tests -p 'test_manual_otp.py' -v 2>&1 | tee -a provider-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-test-evidence
          path: provider-tests.txt
