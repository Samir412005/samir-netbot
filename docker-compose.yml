services:
  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head
    volumes: [data:/data]
  api:
    build: .
    env_file: .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=* --no-access-log
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: [data:/data]
    networks: [backend]
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    command: python -m bot.main
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: [data:/data]
    networks: [backend]
    restart: unless-stopped
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:-netbot.example.org}
    ports: ['80:80','443:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro','caddy_data:/data']
    networks: [backend]
    depends_on: [api]
    restart: unless-stopped
networks:
  backend: {}
volumes:
  data: {}
  caddy_data: {}
